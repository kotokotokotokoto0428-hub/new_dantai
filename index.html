const state={current:"q1",history:[],answers:{},result:null,orgName:"",matchedOrg:null};
const qArea=document.getElementById("questionArea"),rArea=document.getElementById("resultArea"),toast=document.getElementById("toast");
const orgInput=document.getElementById("orgName"),searchResult=document.getElementById("searchResult");

function normalize(s){return String(s||"").normalize("NFKC").replace(/[\s　]/g,"").toLowerCase();}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}

function searchOrganizations(){
const raw=orgInput.value.trim();state.orgName=raw;searchResult.hidden=false;
if(!raw){searchResult.innerHTML="<strong>団体名を入力してください。</strong>";return;}
const n=normalize(raw);
const matches=ORG_LIST.filter(x=>{const a=normalize(x.name);return a.includes(n)||n.includes(a);}).sort((a,b)=>b.name.length-a.name.length);
if(!matches.length){
searchResult.innerHTML='<strong>登録団体は見つかりませんでした。</strong><div class="actions"><button class="btn btn-secondary" id="manualBtn" type="button">登録団体に該当しないため、通常のフローで判定する</button></div>';
document.getElementById("manualBtn").onclick=()=>resetFlow();return;}
const top=matches[0],unique=matches.slice(0,8);
searchResult.innerHTML=`<strong>検索結果（${matches.length}件）</strong>${unique.map(m=>`<div class="match"><div><strong>${escapeHtml(m.name)}</strong><br><span class="small">入力：${escapeHtml(raw)}</span></div><span class="badge badge-${m.category}">${m.category} 判定</span></div>`).join("")}<div class="help" style="margin:12px 0 0">複数候補がある場合は、最も長く一致する団体名称を自動採用します。</div><div class="actions"><button class="btn btn-primary" id="applyMatch" type="button">この検索結果で判定する</button><button class="btn btn-secondary" id="manualBtn" type="button">通常のフローで判定する</button></div>`;
document.getElementById("applyMatch").onclick=()=>applyOrgMatch(top);document.getElementById("manualBtn").onclick=()=>resetFlow();
}

function applyOrgMatch(match){
state.orgName=orgInput.value.trim();state.matchedOrg=match;state.answers={};
state.answers.orgSearch={question:"団体名検索",answer:`${state.orgName} → ${match.name}（${match.category}）`};
if(match.category==="A"||match.category==="B"){state.result={type:"profit",reason:`登録団体リストで「${match.name}」が「${match.category}」に分類されているため、営利と判定します。`};showResult();}
else if(match.category==="D"){state.result={type:"nonprofit",reason:`登録団体リストで「${match.name}」が「D」に分類されているため、非営利と判定します。`};showResult();}
}

function resetFlow(){state.current="q1";state.history=[];state.answers={};state.result=null;state.matchedOrg=null;renderQuestion("q1");}

function renderQuestion(id){
const q=QUESTIONS[id];if(!q)return;state.current=id;rArea.hidden=true;qArea.hidden=false;
qArea.innerHTML=`<div class="step-label">${q.step}</div><div class="progress"><div class="progress-bar" style="width:${q.progress}%"></div></div><h2>${q.title}</h2>${q.help?`<div class="help">${q.help}</div>`:""}<div class="options">${q.options.map(o=>`<button class="option" type="button" data-key="${o.key}"><span class="option-code">${o.key}</span><span class="option-title">${o.title}</span>${o.desc?`<span class="option-desc">${o.desc}</span>`:""}</button>`).join("")}</div><div class="actions">${state.history.length?`<button class="btn btn-secondary" id="backBtn" type="button">← 前の質問に戻る</button>`:""}<button class="btn btn-danger" id="resetBtn" type="button">最初からやり直す</button></div>`;
qArea.querySelectorAll(".option").forEach(btn=>btn.onclick=()=>choose(id,btn.dataset.key));
const back=document.getElementById("backBtn");if(back)back.onclick=goBack;document.getElementById("resetBtn").onclick=resetAll;
window.scrollTo({top:document.getElementById("app").offsetTop-15,behavior:"smooth"});
}

function choose(qid,key){
const q=QUESTIONS[qid],selected=q.options.find(o=>o.key===key);if(!selected)return;
state.answers[qid]={key,question:q.title,answer:selected.title};
if(selected.next==="profit"){state.result={type:"profit",reason:selected.reason||"営利目的に該当するため、営利と判定します。"};showResult();return;}
if(selected.next==="nonprofit"){state.result={type:"nonprofit",reason:selected.reason||"非営利目的に該当するため、非営利と判定します。"};showResult();return;}
state.history.push(qid);renderQuestion(selected.next);
}

function goBack(){if(!state.history.length)return;const previous=state.history.pop();delete state.answers[previous];renderQuestion(previous);}

function showResult(){
qArea.hidden=true;rArea.hidden=false;const isProfit=state.result.type==="profit",label=isProfit?"営利":"非営利",answers=Object.values(state.answers);
let evidence="";
if(isProfit)evidence=`<div class="evidence"><strong>確認の目安</strong><ul><li>今回の利用目的・活動内容が分かる資料</li><li>必要に応じて、販売・営業・PR・講師活動等の内容が分かる資料</li></ul></div>`;
else{const q1=state.answers.q1?.key,q4_3=state.answers.q4_3?.key;let extra="";if(q1==="C")extra+="<li>一般社団法人・一般財団法人：定款等、非営利型法人の要件を確認できる資料</li>";if(q1==="E"&&q4_3==="YES")extra+="<li>実費徴収がある場合：料金の内訳・領収書等、材料費・教材費の実費を確認できる資料</li>";evidence=`<div class="evidence"><strong>確認書類の目安</strong><ul>${extra}<li>利用内容を確認できるチラシ・開催案内・プログラム等</li></ul></div>`;}
rArea.innerHTML=`<div class="result ${isProfit?"profit":"nonprofit"}"><div class="result-label">判定結果</div><h2>${label}</h2><div class="reason"><strong>判定理由</strong><br>${state.result.reason}</div></div><div class="section-title">今回の回答</div><ol class="answer-list">${answers.map(a=>`<li><strong>${a.question}</strong><br>${a.answer}</li>`).join("")}</ol><div class="section-title">確認書類の目安</div>${evidence}<div class="notice">※この判定は入力された回答・登録団体リストに基づく補助判定です。最終的な利用許可・料金区分は、最新の条例・管理運用規程・施設内運用ルール等と申請内容を照合して確認してください。</div><label class="consent"><input type="checkbox" id="consent"><span>入力内容に虚偽がないこと、また今回の利用実態と申請内容が一致していることを確認しました。</span></label><div class="actions"><button class="btn btn-primary" id="completeBtn" type="button" disabled>確認して完了</button><button class="btn btn-secondary" id="copyBtn" type="button">判定結果をコピー</button><button class="btn btn-secondary" id="editBtn" type="button">前の質問に戻る</button><button class="btn btn-danger" id="restartBtn" type="button">最初からやり直す</button></div>`;
document.getElementById("consent").onchange=e=>document.getElementById("completeBtn").disabled=!e.target.checked;
document.getElementById("completeBtn").onclick=()=>showToast("確認が完了しました。");document.getElementById("copyBtn").onclick=copyResult;document.getElementById("editBtn").onclick=goBackFromResult;document.getElementById("restartBtn").onclick=resetAll;
window.scrollTo({top:document.getElementById("app").offsetTop-15,behavior:"smooth"});
}

function goBackFromResult(){const keys=Object.keys(state.answers).filter(k=>k!=="orgSearch");if(!keys.length)return renderQuestion("q1");const last=keys[keys.length-1];delete state.answers[last];renderQuestion(last);}
async function copyResult(){const label=state.result.type==="profit"?"営利":"非営利";const text=["都城市中心市街地中核施設｜団体区分・料金区分 自動判定",`団体名：${state.orgName||"未入力"}`,`判定結果：${label}`,`判定理由：${state.result.reason}`,"","今回の回答：",...Object.values(state.answers).map(a=>`・${a.question} → ${a.answer}`)].join("\n");try{await navigator.clipboard.writeText(text);showToast("判定結果をコピーしました。");}catch(e){const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();showToast("判定結果をコピーしました。");}}
function resetAll(){orgInput.value="";searchResult.hidden=true;state.orgName="";resetFlow();window.scrollTo({top:0,behavior:"smooth"});}
function showToast(message){toast.textContent=message;toast.style.display="block";clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.style.display="none",2200);}
document.getElementById("searchBtn").onclick=searchOrganizations;orgInput.addEventListener("keydown",e=>{if(e.key==="Enter")searchOrganizations();});renderQuestion("q1");
</script>
</body>
</html>
